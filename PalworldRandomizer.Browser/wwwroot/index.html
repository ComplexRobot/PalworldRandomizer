<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palworld Randomizer</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202630;
            color: #D9E2F0;
            font: 13px system-ui, sans-serif;
        }
        body {
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
        }
        #out { position: relative; min-height: 0; overflow: hidden; }
        /* A separate footer keeps recovery usable without covering any application control. */
        #recovery-panel {
            position: relative;
            display: grid;
            grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
            gap: 4px 12px;
            z-index: 50;
            width: 100%;
            box-sizing: border-box;
            background: #1A2029;
            border: 1px solid #42536B;
            border-radius: 0;
            padding: 8px 12px;
            box-shadow: 0 4px 18px #0008;
        }
        #recovery-panel h2 { display: none; }
        #manual-software-recovery {
            width: 100%;
            grid-row: 1 / span 2;
            padding: 9px 10px;
            border-radius: 6px;
            border: 1px solid #8CB5DC;
            background: #34465E;
            color: #F2F6FB;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        #manual-software-recovery:focus-visible { outline: 3px solid #8CB5DC; outline-offset: 2px; }
        #manual-software-recovery:disabled { opacity: .65; cursor: progress; }
        #recovery-status { grid-column: 2; margin: 0; color: #C9D7E8; line-height: 1.35; }
        #recovery-hint { grid-column: 2; margin: 0; color: #99ABC4; font-size: 12px; }
        @media (max-width: 600px) {
            #recovery-panel { grid-template-columns: minmax(0, 1fr); }
            #manual-software-recovery { grid-row: auto; }
            #recovery-status, #recovery-hint { grid-column: 1; }
        }
    </style>
</head>
<body>
<div id="out"></div>
<section id="recovery-panel" aria-label="Manual software recovery">
    <h2>Manual software recovery</h2>
    <button id="manual-software-recovery" type="button">Restart in software rendering</button>
    <p id="recovery-status" role="status" aria-live="polite">
        Recovery is ready to prepare a checkpoint.
    </p>
    <p id="recovery-hint">
        Saves this tab's current work, then reloads this page with software rendering.
        Your saved rendering preference is not changed.
    </p>
</section>
<script type="module" src="recovery-store.js"></script>
<script type="module" src="recovery.js"></script>
<script type="module" src="main.module.js"></script>
</body>
</html>

# nexus.* values retain the audited exactDescription text without rewriting.
# implementation.* values are owner-approved code-backed additions, NOT Nexus quotations.
Culture: en-US
Strings:
    settings.RandomSeed.label: 'Random Seed:'
    nexus.N642: A "seed" used by the randomizer to start the generation process. Locking this will ensure consistent
        results.
    category.Randomize: Randomize
    controls.randomSeed.label.0: 'Random Seed:'
    settings.RandomSeedLocked.label: Lock Seed
    controls.randomSeedLocked.label.0: Lock Seed
    settings.RandomizeField.label: Overworld Pals
    nexus.N634: Affects all spawns outside of dungeons except for bosses.
    category.AreaSelections: Area Selections
    controls.randomizeField.label.0: Overworld Pals
    settings.RandomizeDungeons.label: Dungeon Pals
    nexus.N635: Affects all spawns inside dungeons except for bosses.
    controls.randomizeDungeons.label.0: Dungeon Pals
    settings.RandomizeDungeonBosses.label: Dungeon Bosses
    nexus.N636: Affects bosses inside dungeons.
    controls.randomizeDungeonBosses.label.0: Dungeon Bosses
    settings.RandomizeFieldBosses.label: Overworld Bosses
    nexus.N637: Affects bosses outside dungeons, not including tower bosses or raid bosses.
    controls.randomizeFieldBosses.label.0: Overworld Bosses
    settings.RandomizePredators.label: Predators
    implementation.RandomizePredators.description: Retained legacy predator-area selection. The original control
        is hidden and the current generation code does not read this switch; it does not enable or disable predator
        randomization.
    controls.randomizePredators.label.0: Predators
    settings.PredatorChance.label: 'Predator Spawn Rate:'
    implementation.PredatorChance.description: Retained legacy predator appearance percentage. The original control
        is hidden; generation clamps it to 0–100 and calculates a local fraction, but never uses that fraction
        to change spawns.
    controls.predatorChance.label.0: 'Predator Spawn Rate:'
    settings.RandomizeCages.label: Cages
    nexus.N638: Locked cages of Pals found at enemy camps.
    controls.randomizeCages.label.0: Cages
    settings.RandomizeEggs.label: Overworld Eggs
    nexus.N639: Random eggs that spawn around the map.
    controls.randomizeEggs.label.0: Overworld Eggs
    settings.RandomizeQuests.label: Quest Areas
    implementation.RandomizeQuests.description: Retained legacy quest-area selection. The original control is
        hidden and the current generation code does not read this switch; it does not change quest spawns.
    controls.randomizeQuests.label.0: Quest Areas
    settings.RandomizeMimics.label: Mimics
    implementation.RandomizeMimics.description: Retained legacy mimic-area selection. The original control is
        hidden and the current generation code does not read this switch; it does not change mimic spawns.
    controls.randomizeMimics.label.0: Mimics
    settings.RandomizeAllArea.label: Global Spawns
    nexus.N640: 'Spawn tables that have spawners throughout the world. As of 1.0, this is a single spawn table:
        1% chance level 55 Dupin spawn.'
    controls.randomizeAllArea.label.0: Global Spawns
    settings.RandomizeSingleSpawns.label: Solo Spawns
    nexus.N641: Spawn tables that contain only one possible spawn group or species of which there are many as
        of 1.0. The level 55 Dupin spawn is also  a solo spawn, but the Global Spawn setting with take priority.
    controls.randomizeSingleSpawns.label.0: Solo Spawns
    settings.RandomizeHumanBosses.label: Human Bosses
    implementation.RandomizeHumanBosses.description: Replaces the leading human in each human-boss area with a
        randomly selected human boss. In human-boss squad areas, also chooses the total number of humans and the
        requested boss subset using the Human Bosses count ranges. This is separate from allowing human bosses
        in the general character pool.
    controls.randomizeHumanBosses.label.0: Human Bosses
    settings.RandomizeHumanBossesPals.label: Human Boss Pals
    implementation.RandomizeHumanBossesPals.description: Rebuilds Pal companions in human-boss areas. Removes
        existing companions, chooses a total companion count and a requested boss-Pal subset from their ranges,
        then adds at most one companion to each available human entry. The available entries also limit both counts.
    controls.randomizeHumanBossesPals.label.0: Human Boss Pals
    settings.EqualizeAreaRarity.label: Equalize Global Rarity
    nexus.N716: Will shuffle the global list of spawn groups of all areas to have consistent rarity composition
        between them.
    category.Probability: Probability
    controls.equalizeAreaRarity.label.0: Equalize Global Rarity
    settings.MethodFull.label: All Species Everywhere
    nexus.N657: All possible spawns will have a chance to appear in all areas. Random groups will be added until
        all species are in every spawn table.
    category.AreaGroupType: Area Group Type
    controls.methodFull.label.0: All Species Everywhere
    settings.MethodCustomSize.label: 'Custom Groups Count (Per Area):'
    nexus.N658: Sets an exact number of possible spawn groups in each area. Will fill each spawn table with the
        chosen number of random spawn groups.
    controls.methodCustomSize.label.0: 'Custom Groups Count (Per Area):'
    settings.SpawnListSize.label: 'Custom Groups Count (Per Area):'
    controls.spawnListSize.label.0: 'Custom Groups Count (Per Area):'
    settings.MethodLocalSwap.label: Match Vanilla Groups Count (Per Area)
    nexus.N659: Each area will have the same number of groups as vanilla, swapped out with random ones.
    controls.methodLocalSwap.label.0: Match Vanilla Groups Count (Per Area)
    settings.MethodGlobalSwap.label: Global Species Swap
    nexus.N660: Every character in the vanilla spawn list will be matched with a random choice and changed one-to-one
        in every spawn table. It depends only on the first pal in a group and pairs it with a random group.
    controls.methodGlobalSwap.label.0: Global Species Swap
    settings.MethodNone.label: No Randomization
    nexus.N661: Don't randomize the groups, the chosen options will be filters that modify the vanilla spawn tables.
    controls.methodNone.label.0: No Randomization
    settings.VanillaPlus.label: 'Add To Vanilla With Probability:'
    nexus.N662: Randomized results are appended to the vanilla spawn lists. The chance of a non-vanilla group
        spawning is the specified percentage.
    controls.vanillaPlus.label.0: 'Add To Vanilla With Probability:'
    settings.VanillaPlusChance.label: 'Add To Vanilla With Probability:'
    controls.vanillaPlusChance.label.0: 'Add To Vanilla With Probability:'
    settings.VanillaMerge.label: Merge Vanilla
    nexus.N663: Randomized results are merged with the vanilla spawn groups, making every group contain vanilla
        spawns at roughly the same spawn probability as vanilla. This will make it so vanilla spawns have random
        pals spawned alongside them. Warning! This will easily add a lot of extra pals to the groups and will
        add extra bosses to every boss spawn.
    controls.vanillaMerge.label.0: Merge Vanilla
    settings.VanillaPlusFilter.label: Filter Vanilla Before Adding
    nexus.N664: When enabled, the vanilla spawn lists will be filtered the same as "No Randomization" before adding
        to or merging with the spawn list.
    controls.vanillaPlusFilter.label.0: Filter Vanilla Before Adding
    settings.VanillaMergeFilter.label: Filter Vanilla Before Merging
    controls.vanillaMergeFilter.label.0: Filter Vanilla Before Merging
    settings.GroupVanilla.label: Vanilla-Based
    nexus.N683: Generates groups similar to groups in the vanilla spawn tables. Will try to match existing vanilla
        groups as closely as possible.
    category.SpawnGroupSettings: Spawn Group Settings
    controls.groupVanilla.label.0: Vanilla-Based
    settings.GroupRandom.label: Randomized
    nexus.N684: Creates completely random groups, combining totally random Pals together.
    controls.groupRandom.label.0: Randomized
    settings.FieldBossExtended.label: Multiple Overworld Boss Spawns
    nexus.N686: Normally, overworld bosses will only have one group, ~~and will therefore always match the icon
        that appears on the map screen~~. With this checked, there will instead be multiple possible random boss
        spawns on a given overworld location.
    controls.fieldBossExtended.label.0: Multiple Overworld Boss Spawns
    settings.GroupMin.label: 'Randomized Group Size:'
    nexus.N685: Sets the number of pals in a group to be random between the minimum and maximum chosen.
    controls.groupMin.label.0: 'Randomized Group Size:'
    settings.GroupMax.label: 'Randomized Group Size:'
    controls.groupMax.label.0: 'Randomized Group Size:'
    settings.GroupMinBoss.label: 'Randomized Group Size: Bosses:'
    controls.groupMinBoss.label.0: 'Randomized Group Size:'
    controls.groupMinBoss.label.1: 'Bosses:'
    settings.GroupMaxBoss.label: 'Randomized Group Size: Bosses:'
    controls.groupMaxBoss.label.0: 'Randomized Group Size:'
    controls.groupMaxBoss.label.1: 'Bosses:'
    settings.MultiBoss.label: Boss Groups Are All Bosses
    nexus.N687: Normally, boss groups will contain only one boss Pal and possibly some normal Pals with it. With
        this checked, boss groups will instead be composed of multiple bosses.
    controls.multiBoss.label.0: Boss Groups Are All Bosses
    settings.VanillaRestrict.label: Restrict To Vanilla
    nexus.N688: Makes areas contain only pals that appear in that area in vanilla. Could be used to make areas
        contain random groups comprised only of vanilla characters.
    controls.vanillaRestrict.label.0: Restrict To Vanilla
    settings.HumanBossMin.label: 'Human Bosses: Total:'
    implementation.HumanBossMin.description: Minimum total number of humans selected for a human-boss squad when
        human-boss area randomization is enabled. Generation clamps this minimum to 1–3; bosses are included within
        this total, not added on top of it.
    controls.humanBossMin.label.0: 'Human Bosses:'
    controls.humanBossMin.label.1: 'Total:'
    settings.HumanBossMax.label: 'Human Bosses: Total:'
    implementation.HumanBossMax.description: Maximum total number of humans selected for a human-boss squad when
        human-boss area randomization is enabled. Generation clamps it between the effective total minimum and
        3; bosses are included within this total.
    controls.humanBossMax.label.0: 'Human Bosses:'
    controls.humanBossMax.label.1: 'Total:'
    settings.HumanBossBossMin.label: 'Human Bosses: Bosses:'
    implementation.HumanBossBossMin.description: Minimum requested number of human bosses within a human-boss
        squad's total human count. Generation clamps the requested minimum between 1 and the effective total maximum;
        the actual boss subset cannot exceed the selected total human count.
    controls.humanBossBossMin.label.0: 'Human Bosses:'
    controls.humanBossBossMin.label.1: 'Bosses:'
    settings.HumanBossBossMax.label: 'Human Bosses: Bosses:'
    implementation.HumanBossBossMax.description: Maximum requested number of human bosses within a human-boss
        squad's total human count. Generation clamps it between the effective requested boss minimum and total
        maximum; the actual boss subset cannot exceed the selected total human count.
    controls.humanBossBossMax.label.0: 'Human Bosses:'
    controls.humanBossBossMax.label.1: 'Bosses:'
    settings.HumanBossPalMin.label: 'Human Bosses: Total:'
    implementation.HumanBossPalMin.description: Minimum total number of Pal companions selected in a human-boss
        area when companion randomization is enabled. Generation clamps this minimum to 0–3 and also limits it
        to the available human entries. Boss Pals are included within this total.
    controls.humanBossPalMin.label.0: 'Human Bosses:'
    controls.humanBossPalMin.label.1: 'Total:'
    settings.HumanBossPalMax.label: 'Human Bosses: Total:'
    implementation.HumanBossPalMax.description: Maximum total number of Pal companions selected in a human-boss
        area when companion randomization is enabled. Generation clamps it between the effective total companion
        minimum and 3, then limits it to the available human entries. Boss Pals are included within this total.
    controls.humanBossPalMax.label.0: 'Human Bosses:'
    controls.humanBossPalMax.label.1: 'Total:'
    settings.HumanBossPalBossMin.label: 'Human Bosses: Bosses:'
    implementation.HumanBossPalBossMin.description: Minimum requested number of boss Pals within the total Pal
        companions in a human-boss area. Generation clamps it between 0 and the effective total companion maximum;
        the actual boss-Pal subset is limited by the selected total companions and available human entries.
    controls.humanBossPalBossMin.label.0: 'Human Bosses:'
    controls.humanBossPalBossMin.label.1: 'Bosses:'
    settings.HumanBossPalBossMax.label: 'Human Bosses: Bosses:'
    implementation.HumanBossPalBossMax.description: Maximum requested number of boss Pals within the total Pal
        companions in a human-boss area. Generation clamps it between the effective requested boss-Pal minimum
        and total companion maximum; the actual boss-Pal subset is limited by the selected total companions and
        available human entries.
    controls.humanBossPalBossMax.label.0: 'Human Bosses:'
    controls.humanBossPalBossMax.label.1: 'Bosses:'
    settings.RarityLevelBoost.label: 'Minimum Level For Rare Pals:'
    nexus.N689: Sets a minimum level for pals at or above a certain rarity to the numbers chosen.
    controls.rarityLevelBoost.label.0: 'Minimum Level For Rare Pals:'
    settings.Rarity67MinLevel.label: 'Minimum Level For Rare Pals: 6-7:'
    controls.rarity67MinLevel.label.0: 'Minimum Level For Rare Pals:'
    controls.rarity67MinLevel.label.1: '6-7:'
    settings.Rarity8UpMinLevel.label: 'Minimum Level For Rare Pals: 8+:'
    controls.rarity8UpMinLevel.label.0: 'Minimum Level For Rare Pals:'
    controls.rarity8UpMinLevel.label.1: '8+:'
    settings.Rarity9UpBossOnly.label: Rare (9+) Pals Are Boss-Only
    nexus.N690: Pals with a rarity of 9 or above will only be bosses and spawn only at boss locations. (This may
        prevent them from appearing at all with certain settings. Use All Species Everywhere with Dungeon Bosses
        enabled or Multiple Spawn Groups For Overworld Bosses to ensure all are possible with this setting.)
    controls.rarity9UpBossOnly.label.0: Rare (9+) Pals Are Boss-Only
    settings.Rarity8UpSolo.label: Rare (8+) Pals Always Solo
    nexus.N691: Pals with a rarity of 8 or above will always be in a solo group, overriding the chosen group settings.
    controls.rarity8UpSolo.label.0: Rare (8+) Pals Always Solo
    settings.Rarity8UpSanity.label: Rare (8+) Pals Sanity
    nexus.N692: ' An alternative to the always solo setting that ensures every group can have at most 1 Pal of
        rarity 8 or above. Experimental setting: May make generation very slow and more Pal species duplicates.'
    controls.rarity8UpSanity.label.0: Rare (8+) Pals Sanity
    settings.MixHumanAndPal.label: Allow Mixed Pal/Human Groups
    nexus.N693: Spawn groups will have a chance to be a mix of pals and humans in the same group. Disable this
        to keep humans and pals in separate groups.
    controls.mixHumanAndPal.label.0: Allow Mixed Pal/Human Groups
    settings.SeparateAggroHumans.label: Non-Aggro Human Sanity
    nexus.N695: Prevent non-aggro humans (e.g., merchants or police) from being grouped with aggro pals/humans
        or bosses. This will avoid a forced wanted level when retaliating against aggro characters.
    controls.separateAggroHumans.label.0: Non-Aggro Human Sanity
    settings.BossesEverywhere.label: 'Bosses Everywhere:'
    nexus.N696: Bosses will spawn on the overworld at the specified percentage rate in non-boss areas. This appends
        a boss spawn list to each non-boss area using all settings exactly like a boss area. This means bosses
        could spawn anywhere, not just at the designated boss locations.
    controls.bossesEverywhere.label.0: 'Bosses Everywhere:'
    settings.BossesEverywhereChance.label: 'Bosses Everywhere:'
    controls.bossesEverywhereChance.label.0: 'Bosses Everywhere:'
    settings.BossesEverywhereDungeons.label: 'Bosses Everywhere (Dungeons):'
    nexus.N697: Bosses everywhere for dungeons. The normal "Bosses Everywhere" setting only affects the overworld.
    controls.bossesEverywhereDungeons.label.0: 'Bosses Everywhere (Dungeons):'
    settings.BossesEverywhereDungeonsChance.label: 'Bosses Everywhere (Dungeons):'
    controls.bossesEverywhereDungeonsChance.label.0: 'Bosses Everywhere (Dungeons):'
    settings.BossEggs.label: 'Boss Eggs:'
    nexus.N698: Allow overworld egg spawns to be bosses at the specified percentage chance. Works similarly to
        "Bosses Everywhere."
    controls.bossEggs.label.0: 'Boss Eggs:'
    settings.BossEggsChance.label: 'Boss Eggs:'
    controls.bossEggsChance.label.0: 'Boss Eggs:'
    settings.SeparateFlying.label: Flying Pal Sanity
    nexus.N694: High-flying pals will only be grouped with other high-flying pals. Otherwise, it could have awkward
        pals on the ground grouped with pals in the sky.
    controls.separateFlying.label.0: Flying Pal Sanity
    settings.PredatorConstraint.label: Restrict Predators
    implementation.PredatorConstraint.description: Retained legacy predator-group restriction. The original control
        is hidden and the current generation code does not read this switch; changing it does not impose predator-group
        constraints.
    controls.predatorConstraint.label.0: Restrict Predators
    settings.AllowCagedHumans.label: Allow Caged Humans
    nexus.N699: Disable this to prevent humans from appearing in cages.
    controls.allowCagedHumans.label.0: Allow Caged Humans
    settings.StartSheepBall.label: Lamball At Start
    nexus.N701: 'Guarantees Lamball spawns at the Plateau of Beginnings so the tutorial quest is completable.
        Note: This just makes it so the spawn table "green_A_SheepBall" remains untouched.'
    controls.startSheepBall.label.0: Lamball At Start
    settings.MinOneCountSolo.label: Min 1 Count Solo Pals
    implementation.MinOneCountSolo.description: Raises the first-character minimum count clamp to at least 1 for
        a generated group with exactly one character. This original control is hidden, but the generation path
        still reads it; cage and egg entries return before this step.
    controls.minOneCountSolo.label.0: Min 1 Count Solo Pals
    settings.HumanDamageCap.label: 'Damage Multiplier Cap: Humans:'
    implementation.HumanDamageCap.description: Caps the outgoing-damage multiplier for used non-boss humans in
        PalSchema export. Values below 0 are treated as 0, and only characters whose existing EnemyInflictDamageRate
        exceeds the cap receive a data-table override.
    controls.humanDamageCap.label.0: 'Damage Multiplier Cap:'
    controls.humanDamageCap.label.1: 'Humans:'
    settings.HumanBossDamageCap.label: 'Damage Multiplier Cap: Human Bosses:'
    implementation.HumanBossDamageCap.description: Caps the outgoing-damage multiplier for used human bosses in
        PalSchema export. Values below 0 are treated as 0, and only characters whose existing EnemyInflictDamageRate
        exceeds the cap receive a data-table override.
    controls.humanBossDamageCap.label.0: 'Damage Multiplier Cap:'
    controls.humanBossDamageCap.label.1: 'Human Bosses:'
    settings.PredatorDamageCap.label: 'Damage Multiplier Cap: Predators:'
    implementation.PredatorDamageCap.description: Caps the outgoing-damage multiplier for used Pals whose internal
        names start with PREDATOR_ in PalSchema export. Values below 0 are treated as 0, and only characters whose
        existing EnemyInflictDamageRate exceeds the cap receive a data-table override.
    controls.predatorDamageCap.label.0: 'Damage Multiplier Cap:'
    controls.predatorDamageCap.label.1: 'Predators:'
    settings.RaidDamageCap.label: 'Damage Multiplier Cap: Raid Bosses:'
    implementation.RaidDamageCap.description: Caps the outgoing-damage multiplier for used Pals whose internal
        names start with RAID_ in PalSchema export. Values below 0 are treated as 0, and only characters whose
        existing EnemyInflictDamageRate exceeds the cap receive a data-table override.
    controls.raidDamageCap.label.0: 'Damage Multiplier Cap:'
    controls.raidDamageCap.label.1: 'Raid Bosses:'
    settings.WeightTypeUniform.label: 'Random Weight Range:'
    nexus.N714: All pals will be given a random weight between the two chosen numbers. This makes complete chaos
        with no balance to the spawns. A powerful legendary pal could spawn just as likely as a weak starting
        area pal.
    controls.weightTypeUniform.label.0: 'Random Weight Range:'
    settings.WeightTypeCustom.label: 'Rarity-Based Weights:'
    nexus.N715: Sets the weight of each group based on the pal's internal rarity number. This will make legendary
        pals much rarer to spawn than weaker ones.
    controls.weightTypeCustom.label.0: 'Rarity-Based Weights:'
    settings.WeightUniformMin.label: 'Random Weight Range:'
    controls.weightUniformMin.label.0: 'Random Weight Range:'
    settings.WeightUniformMax.label: 'Random Weight Range:'
    controls.weightUniformMax.label.0: 'Random Weight Range:'
    settings.WeightCustom.label: 'Rarity-Based Weights: 1:'
    nexus.N725: These are the weights that will be set for each rarity value respectively. Setting a weight to
        0 will remove all pals of that rarity as possible spawns.
    controls.weightCustom1.label.0: 'Rarity-Based Weights:'
    controls.weightCustom1.label.1: '1:'
    controls.weightCustom2.label.0: 'Rarity-Based Weights:'
    controls.weightCustom2.label.1: '2:'
    controls.weightCustom3.label.0: 'Rarity-Based Weights:'
    controls.weightCustom3.label.1: '3:'
    controls.weightCustom4.label.0: 'Rarity-Based Weights:'
    controls.weightCustom4.label.1: '4:'
    controls.weightCustom5.label.0: 'Rarity-Based Weights:'
    controls.weightCustom5.label.1: '5:'
    controls.weightCustom6.label.0: 'Rarity-Based Weights:'
    controls.weightCustom6.label.1: '6:'
    controls.weightCustom7.label.0: 'Rarity-Based Weights:'
    controls.weightCustom7.label.1: '7:'
    controls.weightCustom8.label.0: 'Rarity-Based Weights:'
    controls.weightCustom8.label.1: '8:'
    controls.weightCustom9.label.0: 'Rarity-Based Weights:'
    controls.weightCustom9.label.1: '9:'
    controls.weightCustom10.label.0: 'Rarity-Based Weights:'
    controls.weightCustom10.label.1: '10:'
    controls.weightCustom20.label.0: 'Rarity-Based Weights:'
    controls.weightCustom20.label.1: '20:'
    settings.WeightCustomMode.label: 'Group Weight Mode:'
    implementation.WeightCustomMode.description: Selects how character rarity weights are combined into a group
        weight. Rarity Minimum and Rarity Maximum choose a character by lowest or highest rarity, respectively,
        then use that character's rarity weight and weight scale; they do not select the lowest or highest numeric
        weight. When Prioritize Boss Rarity is enabled and a group contains bosses, only bosses participate in
        this calculation.
    nexus.N730: Determines how the weight will be set for groups of multiple pals.
    options.WeightCustomMode.0.label: Weight Sum
    nexus.N737: Does a simple operation of combining the weights of the pals in a group.
    options.WeightCustomMode.1.label: Weight Average
    options.WeightCustomMode.2.label: Rarity Average (Rounded)
    nexus.N738: Gets the average rarity and then chooses the weight associated with that rarity. Rounded will
        simply round to the closest rarity value. Blend Fractions will blend the weights for fractional rarities
        and Blend 10-20 will round for 1-10 and blend between 10-20.
    options.WeightCustomMode.3.label: Rarity Average (Blend Fractions)
    options.WeightCustomMode.4.label: Rarity Average (Blend 10 to 20)
    options.WeightCustomMode.5.label: Rarity Minimum
    implementation.WeightCustomMode.5.description: Selects the first character with the lowest rarity in the
        participating group, then uses that character's rarity weight and weight scale. This selects by rarity,
        not by numeric weight. If boss prioritization is enabled and bosses are present, only bosses participate.
    options.WeightCustomMode.6.label: Rarity Maximum
    implementation.WeightCustomMode.6.description: Selects the first character with the highest rarity in the
        participating group, then uses that character's rarity weight and weight scale. This selects by rarity,
        not by numeric weight. If boss prioritization is enabled and bosses are present, only bosses participate.
    options.WeightCustomMode.7.label: Weight Minimum
    options.WeightCustomMode.8.label: Weight Maximum
    controls.weightCustomMode.label.0: 'Group Weight Mode:'
    settings.HumanRarity.label: 'Human Rarity:'
    nexus.N726: Set the rarity of humans which are normally all 1 in the game's data.
    controls.humanRarity.label.0: 'Human Rarity:'
    settings.HumanBossRarity.label: 'Human Boss:'
    nexus.N727: Set the rarity of human bosses which are normally all 1.
    controls.humanBossRarity.label.0: 'Human Boss:'
    settings.MaxCageRarity.label: 'Max Cage Rarity:'
    nexus.N700: Will prevent Pals of a higher rarity than the number chosen from appearing in cages.
    controls.maxCageRarity.label.0: 'Max Cage Rarity:'
    settings.WeightAdjustProbability.label: Convert Weights To Percentages
    nexus.N728: 'Will make groups of a given weight have that weight as a percent chance to spawn. For example,
        a group with a weight of 1 will have a 1% chance to spawn. All groups around the same weight will be put
        together and scaled to fit within the 1% chance. This is repeated for 1%, 5%, 10%,  and 25%, then higher
        weighted groups are scaled to fit into the remaining 59%. The following weight values will be fit to the
        specified percentage: 1%: 1-4. 5%: 5-9, 10%: 10-15, 25%: 16-30, 59%: 31 and above.'
    controls.weightAdjustProbability.label.0: Convert Weights To Percentages
    settings.WeightPrioritizeBoss.label: Prioritize Boss Rarity
    nexus.N729: When a group contains bosses and non-bosses together, only the boss pal(s) will be considered
        when choosing the rarity of the group.
    controls.weightPrioritizeBoss.label.0: Prioritize Boss Rarity
    settings.HumanWeight.label: 'Human Weight:'
    nexus.N741: Multiplies the weight of regular non-aggro humans.
    controls.humanWeight.label.0: 'Human Weight:'
    settings.HumanWeightAggro.label: 'Aggro Human Weight:'
    nexus.N742: Multiplies the weight of aggressive humans.
    controls.humanWeightAggro.label.0: 'Aggro Human Weight:'
    settings.WeightNightOnly.label: 'Night-Only Weight Multiplier:'
    nexus.N743: Multiplies the weight of night spawns. With a high number, this ensures diurnal pals only spawn
        during the day and nocturnal pals spawn at night. If you would prefer to allow day pals to have a chance
        to spawn at night, reduce this number to a small value like something between 1-10.
    controls.weightNightOnly.label.0: 'Night-Only Weight Multiplier:'
    settings.OverflowFixMode.label: 'Int Overflow Fix:'
    nexus.N744: If the sum of all weights in an area exceeds the max value of a signed 32-bit integer, it will
        cause a bug with spawn probability in the game. It is very unlikely for this to happen with normal settings,
        but I've included a fix for it just in case.
    options.OverflowFixMode.0.label: Scale All
    nexus.N751: Scale All will simply scale all weights to fit within the allowed sum. Night-Only will prioritize
        scaling night weights first and Dynamic will try to scale day weights without changing probability and
        then fall back to the other two methods.
    options.OverflowFixMode.1.label: Scale Night-Only
    options.OverflowFixMode.2.label: Dynamic (Multi-Pass)
    controls.overflowFixMode.label.0: 'Int Overflow Fix:'
    settings.SpawnPals.label: Pals
    nexus.N763: Normal Pals. Does not include regular boss pals.
    category.PossiblePalSpawns: Possible Pal Spawns
    controls.spawnPals.label.0: Pals
    settings.SpawnHumans.label: Humans (Aggressive)

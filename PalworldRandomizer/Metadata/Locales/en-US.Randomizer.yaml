    settings.ForceAddLevel.label: Enforce Vanilla w/Boss Levels
    nexus.N812: The aforementioned scaling value won't normally apply to vanilla-based groups if they already
        exist in the vanilla spawn tables. Enabling this option will force it to affect pals in vanilla-based
        boss groups. This also enables this function for No Randomization. You should enable this if you are changing
        the w/Boss Level Scale to have a custom effect on all boss groups.
    controls.forceAddLevel.label.0: Enforce Vanilla w/Boss Levels
    settings.LevelScaleMode.label: 'Scale Mode:'
    nexus.N799: Determines how the level scaling settings are applied. Base levels are taken from the weighted
        average of all vanilla levels in a respective area.
    options.LevelScaleMode.0.label: Average Level
    nexus.N804: Scale the average level of each spawn while maintaining the same level range.
    options.LevelScaleMode.1.label: Full
    nexus.N801: Scale the minimum and maximum level of every spawn. Should be roughly equivalent to the in-game
        setting.
    options.LevelScaleMode.2.label: Max. Level
    nexus.N802: Scale only the maximum level.
    options.LevelScaleMode.3.label: Extend Min./Max.
    nexus.N806: Scale the average and increase the range while keeping either the maximum or minimum the same.
        Which value stays the same depends upon if the scale increases or decreases the average. For example,
        you can double the average level while keeping the minimum level the same.
    options.LevelScaleMode.4.label: Maximize Range
    nexus.N805: Scale the average and make the level range the maximum possible while maintaining that average.
        Very chaotic.
    options.LevelScaleMode.5.label: Min. Level
    nexus.N803: Scale only the minimum level.
    options.LevelScaleMode.6.label: Random
    nexus.N807: Sets all spawns' minimum and maximum levels to the chosen values for completely unpredictable
        chaos.
    controls.levelScaleMode.label.0: 'Scale Mode:'

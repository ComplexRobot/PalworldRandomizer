    implementation.CountClampBossMax.description: Upper count clamp for boss characters other than the first character
        in a spawn group, applied after the count multiplier. Generation raises it to at least 1 and the effective
        lower boss clamp. Selection depends on the character's boss flag, not the area's boss classification.
    controls.countClampBossMax.label.0: 'Boss Min/Max:'
    settings.CountClampFirstBossMin.label: 'First Boss Min/Max:'
    implementation.CountClampFirstBossMin.description: Lower count clamp when the first character in a spawn group
        is a boss, applied after the count multiplier. Generation treats negative values as 0. The cold default
        is 1, while the original numeric control's invalid or empty input fallback is 0.
